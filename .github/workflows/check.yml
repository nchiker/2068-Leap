# Build/check gate on every push and PR; downloadable release bundle
# (`make release-assets`) on top of that for pushes and tags.
#
# What the `dist` job does, in order:
#   1. Reuses the same pinned SjASMPlus build as `check` (cached across runs).
#   2. `make release-assets`: assembles the production ROMs, all six
#      loadable BASIC extension .tzx files, the EightyOne/ZEsarUX images,
#      the user manual and what's-new docs (Markdown + DOCX), and zips
#      them into build/2068-Leap-Release-1-Beta.zip with a SHA-256
#      manifest.
#   3. Publishes it:
#        - every run (push or PR):  as a workflow artifact (Actions tab).
#        Nothing is published from this branch any more: `main` holds the
#        archived V1 (Release 1 Beta) line. Releases and the rolling "latest"
#        build come from the V2 workflow on v2-development.
name: Source checks

on:
  push:
  pull_request:

# One dist build per ref at a time; a newer push cancels the older run so
# two runs never race to update the "latest" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned SjASMPlus
        run: |
          git clone --branch v1.23.1 --depth 1 --recurse-submodules --shallow-submodules https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus
          echo "/tmp/sjasmplus" >> "$GITHUB_PATH"
      - name: Run source and build checks
        run: make check
      - name: Build production ROMs and report capacity
        run: make budget

  dist:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read    # nothing is published from this branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so tag lookups work

      - name: Build pinned SjASMPlus
        run: |
          git clone --branch v1.23.1 --depth 1 --recurse-submodules --shallow-submodules https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus
          echo "/tmp/sjasmplus" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-docx (needed by make manual)
        run: pip install --quiet python-docx

      - name: Build the downloadable bundle (make release-assets)
        run: |
          make release-assets
          ls -la build/2068-Leap-Release-1-Beta.zip
          unzip -l build/2068-Leap-Release-1-Beta.zip

      - name: Work out the version string
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git log -1 --format=%cd --date=format:%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the bundle for this build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp build/2068-Leap-Release-1-Beta.zip "build/2068-Leap-$VERSION.zip"
          sha256sum "build/2068-Leap-$VERSION.zip" > "build/2068-Leap-$VERSION.zip.sha256"

      - name: Upload bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2068-Leap-${{ steps.version.outputs.version }}
          path: |
            build/2068-Leap-*.zip
            build/2068-Leap-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Publishing removed (2026-10-12): `main` is the archived V1 branch. The rolling "latest"
      # pre-release and the numbered releases are published only by the V2 workflow on
      # v2-development (see that branch's .github/workflows/check.yml), so a push to this
      # branch can never overwrite them.
